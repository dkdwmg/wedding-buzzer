<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BUZZ! — Host</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
      gap: 32px;
    }

    h1 { font-size: 2.2rem; color: #f0c040; }

    #reset-btn {
      font-size: 1.2rem;
      font-weight: 800;
      padding: 16px 40px;
      border-radius: 12px;
      border: none;
      background: #f0c040;
      color: #1a1a2e;
      cursor: pointer;
    }

    #reset-btn:active { background: #d9ac2e; }

    #list {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #empty {
      color: #666;
      font-size: 1.2rem;
      text-align: center;
      margin-top: 20px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #16213e;
      border-radius: 14px;
      padding: 18px 24px;
      font-size: 1.6rem;
      font-weight: 700;
      animation: pop 0.25s cubic-bezier(.4,1.6,.6,1);
    }

    .row.first { border: 2px solid #2ecc71; background: #16302a; }
    .row.second { border: 2px solid #4a90d9; }
    .row.third { border: 2px solid #b06fd1; }

    .rank {
      font-size: 1.4rem;
      width: 2.4em;
      text-align: center;
    }

    .row.first .rank { color: #2ecc71; }
    .row.second .rank { color: #4a90d9; }
    .row.third .rank { color: #b06fd1; }

    .name { flex: 1; }

    .time { font-size: 0.95rem; color: #777; font-weight: 400; }

    @keyframes pop {
      from { transform: scale(0.9); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>🔔 Buzz Order</h1>
  <button id="reset-btn">Reset for New Round</button>

  <div id="list"></div>
  <div id="empty">Waiting for buzzes...</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const resetBtn = document.getElementById("reset-btn");

  const RANK_CLASS = ["first", "second", "third"];
  const RANK_LABEL = ["1st", "2nd", "3rd"];

  let startTime = null;

  function render(round) {
    listEl.innerHTML = "";

    if (round.buzzes.length === 0) {
      emptyEl.style.display = "block";
      startTime = null;
      return;
    }
    emptyEl.style.display = "none";
    if (startTime === null) startTime = round.buzzes[0].time;

    round.buzzes.forEach((b, i) => {
      const row = document.createElement("div");
      row.className = "row " + (RANK_CLASS[i] || "");
      const rankLabel = RANK_LABEL[i] || `${i + 1}th`;
      const delta = i === 0 ? "" : `+${((b.time - startTime) / 1000).toFixed(2)}s`;
      row.innerHTML = `<div class="rank">${rankLabel}</div><div class="name">${escapeHtml(b.name)}</div><div class="time">${delta}</div>`;
      listEl.appendChild(row);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  resetBtn.addEventListener("click", () => socket.emit("reset"));
  socket.on("state", render);
</script>
</body>
</html>
