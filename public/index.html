<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BUZZ!</title>
  <link rel="preload" as="image" href="/images/squint-face.jpg" />
  <link rel="preload" as="image" href="/images/laugh-face.jpg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding: 24px;
    }

    /* ---------- Login screen ---------- */
    #login {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 360px;
    }

    #login h1 { font-size: 2rem; color: #f0c040; }

    #name-input {
      width: 100%;
      font-size: 1.4rem;
      padding: 16px 18px;
      border-radius: 12px;
      border: 2px solid #444;
      background: #16213e;
      color: #eee;
      text-align: center;
    }

    #name-input:focus { outline: none; border-color: #f0c040; }

    #join-error {
      color: #ff6b6b;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      min-height: 1.2em;
      margin-top: -8px;
    }

    #join-btn {
      width: 100%;
      font-size: 1.3rem;
      font-weight: 800;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: #f0c040;
      color: #1a1a2e;
      cursor: pointer;
    }

    #join-btn:active { background: #d9ac2e; }

    /* ---------- Game screen ---------- */
    #game {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      margin-top: 40px;
    }

    #whoami {
      font-size: 1.1rem;
      color: #888;
    }

    #whoami span { color: #f0c040; font-weight: 700; }

    #buzz-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(60vw, 280px);
      height: min(60vw, 280px);
      border-radius: 50%;
      background:
        linear-gradient(rgba(192, 57, 43, 0.55), rgba(123, 36, 28, 0.7)),
        url("/images/squint-face.jpg") center / cover;
      border: 6px solid #c0392b;
      box-shadow: 0 10px 0 #7b241c, 0 16px 34px rgba(0,0,0,0.5);
      color: #fff;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s, background 0.15s, border-color 0.15s;
    }

    #buzz-text {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 16px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8), 0 0 18px rgba(0,0,0,0.6);
      pointer-events: none;
    }

    #buzz-btn:active {
      transform: translateY(8px);
      box-shadow: 0 2px 0 #7b241c, 0 4px 15px rgba(0,0,0,0.4);
    }

    /* Stays visually "pressed" after buzzing, swaps to the laughing reaction photo */
    #buzz-btn.buzzed {
      transform: translateY(10px);
      box-shadow: 0 0 0 #145a32, 0 4px 15px rgba(0,0,0,0.4);
      background:
        linear-gradient(rgba(30, 132, 73, 0.4), rgba(20, 90, 50, 0.55)),
        url("/images/laugh-face.jpg") center / cover;
      border-color: #1e8449;
      cursor: default;
    }

    #result {
      font-size: 1.6rem;
      font-weight: 800;
      color: #2ecc71;
      text-align: center;
      min-height: 2.2em;
    }

    #rank-badge {
      display: none;
      font-size: 1.1rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div id="login">
    <h1>🔔 Buzz In</h1>
    <input id="name-input" type="text" placeholder="Enter your name" maxlength="30" autocomplete="off" />
    <div id="join-error"></div>
    <button id="join-btn">Join</button>
  </div>

  <div id="game">
    <div id="whoami">Playing as <span id="my-name"></span></div>
    <button id="buzz-btn">
      <span id="buzz-text">BUZZ</span>
    </button>
    <div id="result"></div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  const login = document.getElementById("login");
  const game = document.getElementById("game");
  const nameInput = document.getElementById("name-input");
  const joinBtn = document.getElementById("join-btn");
  const joinError = document.getElementById("join-error");
  const myNameEl = document.getElementById("my-name");
  const buzzBtn = document.getElementById("buzz-btn");
  const buzzText = document.getElementById("buzz-text");
  const resultEl = document.getElementById("result");

  let myName = "";
  let hasBuzzed = false;

  // Created once on Join (a real user-gesture, required to unlock audio on iOS/mobile)
  // and reused for every buzz — building a fresh AudioContext per tap is what causes lag.
  let audioCtx = null;

  function join() {
    const value = nameInput.value.trim();
    if (!value) {
      nameInput.focus();
      return;
    }

    joinError.textContent = "";
    joinBtn.disabled = true;

    socket.emit("join", value, (res) => {
      joinBtn.disabled = false;

      if (!res.ok) {
        joinError.textContent = res.reason;
        nameInput.focus();
        return;
      }

      myName = res.name;
      myNameEl.textContent = myName;
      login.style.display = "none";
      game.style.display = "flex";

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    });
  }

  joinBtn.addEventListener("click", join);
  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") join();
  });

  // Bell chime: a fundamental plus inharmonic overtones (classic bell-synthesis ratios),
  // each decaying at a slightly different rate so it shimmers like a struck bell.
  function playBuzzSound() {
    const ctx = audioCtx;
    if (!ctx) return;
    const fundamental = 880; // A5
    // Bell overtones aren't simple integer multiples like a string — these ratios
    // approximate a small handbell's partials.
    const partials = [
      { ratio: 1,    gain: 0.35, decay: 1.4 },
      { ratio: 2.0,  gain: 0.18, decay: 1.1 },
      { ratio: 2.76, gain: 0.14, decay: 0.9 },
      { ratio: 4.07, gain: 0.08, decay: 0.6 },
      { ratio: 5.4,  gain: 0.05, decay: 0.4 },
    ];

    partials.forEach(({ ratio, gain: g, decay }) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(fundamental * ratio, ctx.currentTime);
      gain.gain.setValueAtTime(g, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + decay);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + decay);
    });
  }

  buzzBtn.addEventListener("click", () => {
    if (hasBuzzed) return;
    hasBuzzed = true;
    buzzBtn.classList.add("buzzed");
    buzzText.textContent = "BUZZED!";
    playBuzzSound();
    socket.emit("buzz", myName);
  });

  socket.on("state", (round) => {
    const mine = round.buzzes.find(b => b.name.toLowerCase() === myName.toLowerCase());
    if (mine) {
      const rank = round.buzzes.indexOf(mine) + 1;
      const ordinal = rank === 1 ? "1st!" : rank === 2 ? "2nd" : rank === 3 ? "3rd" : `${rank}th`;
      resultEl.textContent = `You buzzed ${ordinal}`;
    } else if (round.buzzes.length === 0) {
      resultEl.textContent = "";
    }

    // A reset clears everyone's buzz list — re-arm the button for a new round.
    if (round.buzzes.length === 0 && hasBuzzed) {
      hasBuzzed = false;
      buzzBtn.classList.remove("buzzed");
      buzzText.textContent = "BUZZ";
      resultEl.textContent = "";
    }
  });
</script>
</body>
</html>
